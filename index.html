<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="/favicon.png" type="image/png">
  <title>Live Streaming</title>

  <style>
    :root {
      --accent: #c8102e;
      --muted: #9aa0a6;
      --gradient: linear-gradient(135deg, #c8102e, #ff3b3b);
      color-scheme: dark;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: url('sfondo.jpg') center center / cover no-repeat fixed;
    }

    .page {
      min-height: 100%;
      backdrop-filter: brightness(0.7) blur(2px);
      display: flex;
      flex-direction: column;
    }

header.banner {
  padding: 18px 20px;
  display: flex;
  flex-direction: column; /* 🔥 aggiungi questo */
  align-items: center;
  text-align: center;     /* 🔥 utile per centrare il testo */
  gap: 10px;
}
header.banner .brand {
  align-items: center;
}


    header.banner img.logo {
      height: 100px;
      width: auto;
      border-radius: 8px;
      object-fit: contain;
    }

    .brand .site { font-weight: 700; color: yellow; }
    .brand .subtitle { font-size: 13px; color: var(--muted); }

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 20px;      /* già c’era */
  padding-top: 2px;       /* 👈 spazio fisso tra header e titolo */
  text-align: center;
  color: #fff;
  border-top: 1px solid transparent; /* 👈 evita il collasso dei margini */
}
h1.title {
  margin: 0 0 12px;        /* niente margine sopra, solo sotto */
  font-size: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}


h1.title img.logo {
  height: 200px;
  width: auto;
  border-radius: 10px;
  display: block;       /* ✅ aggiungi */
  margin: 0 auto;       /* ✅ aggiungi */
}


    .tabs {
      margin-top: 16px;
      display: inline-flex;
      background: rgba(0,0,0,.45);
      border-radius: 12px;
      overflow: hidden;
    }

    .tabs button {
      padding: 10px 16px;
      border: 0;
      background: transparent;
      color: #eee;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--gradient);
      color: white;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .player-wrap {
      background: rgba(0,0,0,.6);
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 6px 30px rgba(0,0,0,.6);
      min-width: 320px;
      max-width: 720px;
      width: 70%;
      margin-top: 18px;
    }

    audio {
      width: 100%;
      border: 2px solid var(--accent);
      border-radius: 12px;
      background: rgba(0,0,0,.6);
      padding: 8px;
    }

    .equalizer {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 12px;
      height: 24px;
    }

    .bar {
      width: 6px;
      background: var(--gradient);
      border-radius: 2px;
      animation: bounce 1s infinite ease-in-out;
      animation-play-state: paused;
    }

    .bar:nth-child(1) { animation-delay:0s }
    .bar:nth-child(2) { animation-delay:.2s }
    .bar:nth-child(3) { animation-delay:.4s }
    .bar:nth-child(4) { animation-delay:.6s }
    .bar:nth-child(5) { animation-delay:.8s }

    @keyframes bounce {
      0%,100% { height:4px; opacity:.6; }
      50% { height:24px; opacity:1; }
    }

    .yt-shell {
      width: 330px;
      height: 240px;
      max-width: 100%;
      border-radius: 10px;
      border: 2px solid var(--accent);
      overflow: hidden;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: yellow;
      font-size: 13px;
    }

    .btn {
      background: var(--gradient);
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      margin:5px;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

  </style>
</head>

<body>
<div class="page">
<header class="banner">
  <img class="logo" src="logo.png">
  <div class="brand">
    <div class="site">Live Streaming</div>
  </div>
</header>

<main>
  <h1 class="title">
    <img class="logo" src="logo1.jpg">

  </h1>

  <div class="tabs">
    <button id="tab-radio" class="active">Radio EI</button>
    <button id="tab-youtube">Video</button>
  </div>

  <!-- RADIO -->
  <section id="panel-radio" class="panel active">
    <div class="player-wrap">
      <audio id="radioPlayer" controls preload="none">
        <source src="http://radio.esercito.difesa.it:8000/stream" type="audio/mpeg">
      </audio>

      <div id="eq-radio" class="equalizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>
  </section>

  <!-- YOUTUBE -->
  <section id="panel-youtube" class="panel">
    <div class="player-wrap">
      <button id="ytPlay" class="btn" disabled>▶ Riproduci</button>
      <button id="ytPause" class="btn" disabled>⏸ Pausa</button>

      <div class="yt-shell">
        <div id="ytPlayer"></div>
      </div>

      <div id="eq-yt" class="equalizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>
  </section>

</main>

<footer>
  &copy; <span id="year"></span> Live Streaming — Powered by Cipollitti
</footer>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

function setEq(eq, run) {
  eq.querySelectorAll('.bar').forEach(b => b.style.animationPlayState = run ? 'running' : 'paused');
}

// Tabs
const tabR = document.getElementById('tab-radio');
const tabY = document.getElementById('tab-youtube');
const panelR = document.getElementById('panel-radio');
const panelY = document.getElementById('panel-youtube');

tabR.onclick = () => {
  tabR.classList.add("active");
  tabY.classList.remove("active");
  panelR.classList.add("active");
  panelY.classList.remove("active");
};

tabY.onclick = () => {
  tabY.classList.add("active");
  tabR.classList.remove("active");
  panelY.classList.add("active");
  panelR.classList.remove("active");
  initYouTube();
};

// RADIO
const radio = document.getElementById('radioPlayer');
const eqR = document.getElementById('eq-radio');

radio.onplay = () => setEq(eqR, true);
radio.onpause = () => setEq(eqR, false);

// YOUTUBE fixed ID
const YT_ID = "PZPRBE42FNo";
let ytPlayer = null;

function loadYTScript() {
  return new Promise((res, rej) => {
    if (window.YT && YT.Player) return res();
    window.onYouTubeIframeAPIReady = res;
    let s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = rej;
    document.head.appendChild(s);
  });
}

function initYouTube() {
  if (ytPlayer) return;
  loadYTScript().then(() => {
    ytPlayer = new YT.Player('ytPlayer', {
      width:320, height:240, videoId:YT_ID,
      playerVars:{ modestbranding:1, rel:0, playsinline:1, controls:1 },
      events:{
        onReady: () => {
          document.getElementById("ytPlay").disabled = false;
          document.getElementById("ytPause").disabled = false;
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) setEq(eqY, true);
          else setEq(eqY, false);
        }
      }
    });
  });
}

const eqY = document.getElementById('eq-yt');
document.getElementById("ytPlay").onclick = () => { ytPlayer.loadVideoById(YT_ID); ytPlayer.playVideo(); };
document.getElementById("ytPause").onclick = () => ytPlayer && ytPlayer.pauseVideo();

</script>
</body>
</html>
